<title>AI Điều Phối Lớp Học Tin Học</title>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Be+Vietnam+Pro:wght@400;500;600;700&display=swap">
<style>
/* Layout: "phòng máy vui nhộn" — băng tiêu đề có robot linh vật, mỗi bước một màu riêng như bìa vở; thẻ bo tròn kiểu nhãn dán, bóng đổ đặc để dễ nhìn khi chiếu lên màn hình lớp */
:root{
  --bg:#e8f4ff; --bg-dot:#d2e7fb; --surface:#ffffff; --surface-2:#f0f6ff; --fg:#1b2559; --muted:#56628c; --line:#d3dff4; --line-strong:#b5c6e8;
  --accent:#2f6bff; --accent-2:#1d4fd8; --accent-soft:#e1eaff; --accent-ink:#ffffff;
  --folder:#ffb703; --folder-2:#d99400; --folder-soft:#fff1c4; --folder-ink:#634300;
  --ok:#17a34a; --ok-2:#0f7d37; --ok-soft:#dcf7e5; --warn:#d97200; --warn-soft:#ffecd1; --bad:#e5484d; --bad-2:#bf2f35; --bad-soft:#ffe3e4;
  --ai:#7c4dff; --ai-2:#5a2ee0; --ai-soft:#eee7ff;
  --pink:#f0477f; --pink-soft:#ffe1ec; --teal:#0d9e9c; --teal-soft:#d4f5f2; --orange:#f26b0f; --orange-soft:#ffe7d4;
  --hero-1:#2f6bff; --hero-2:#7c4dff; --hero-ink:#ffffff; --on-color:#ffffff;
  --shadow:0 10px 30px rgba(27,37,89,.16);
  --f-display:"Baloo 2","Be Vietnam Pro",system-ui,sans-serif;
  --f-body:"Be Vietnam Pro",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --r:16px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0e1433; --bg-dot:#18204d; --surface:#161f47; --surface-2:#1d2858; --fg:#eef2ff; --muted:#a6b1d8; --line:#2b3a74; --line-strong:#090d24;
  --accent:#7ea4ff; --accent-2:#4f78e6; --accent-soft:#1f2e68; --accent-ink:#0e1433;
  --folder:#ffcd4a; --folder-2:#c99712; --folder-soft:#3a3115; --folder-ink:#ffe28f;
  --ok:#4ade80; --ok-2:#1f9a52; --ok-soft:#133a27; --warn:#fbbf24; --warn-soft:#3b2c0f; --bad:#ff7b80; --bad-2:#c4454b; --bad-soft:#47181d;
  --ai:#b39bff; --ai-2:#8463f0; --ai-soft:#2a2160;
  --pink:#ff7aa8; --pink-soft:#4a1b30; --teal:#2fd4c0; --teal-soft:#0f3836; --orange:#ff9d57; --orange-soft:#45260f;
  --hero-1:#1f3a9a; --hero-2:#4b1f9c; --hero-ink:#ffffff; --on-color:#0e1433; --shadow:0 10px 30px rgba(0,0,0,.45); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0e1433; --bg-dot:#18204d; --surface:#161f47; --surface-2:#1d2858; --fg:#eef2ff; --muted:#a6b1d8; --line:#2b3a74; --line-strong:#090d24;
  --accent:#7ea4ff; --accent-2:#4f78e6; --accent-soft:#1f2e68; --accent-ink:#0e1433;
  --folder:#ffcd4a; --folder-2:#c99712; --folder-soft:#3a3115; --folder-ink:#ffe28f;
  --ok:#4ade80; --ok-2:#1f9a52; --ok-soft:#133a27; --warn:#fbbf24; --warn-soft:#3b2c0f; --bad:#ff7b80; --bad-2:#c4454b; --bad-soft:#47181d;
  --ai:#b39bff; --ai-2:#8463f0; --ai-soft:#2a2160;
  --pink:#ff7aa8; --pink-soft:#4a1b30; --teal:#2fd4c0; --teal-soft:#0f3836; --orange:#ff9d57; --orange-soft:#45260f;
  --hero-1:#1f3a9a; --hero-2:#4b1f9c; --hero-ink:#ffffff; --on-color:#0e1433; --shadow:0 10px 30px rgba(0,0,0,.45); color-scheme:dark}
*{box-sizing:border-box}
body{background-color:var(--bg);background-image:radial-gradient(var(--bg-dot) 1.6px,transparent 1.8px);background-size:24px 24px;color:var(--fg);font-family:var(--f-body);font-size:15px;line-height:1.55;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 40px}
h1,h2,h3,h4{font-family:var(--f-display);line-height:1.15;text-wrap:balance;margin:0}
h2{font-size:2rem;font-weight:800}
h3{font-size:1.3rem;font-weight:800}
p{margin:0}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--folder);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.small{font-size:.86rem}

/* băng tiêu đề */
.top{max-width:1320px;margin:14px auto 18px;position:relative;overflow:hidden;display:flex;flex-wrap:wrap;align-items:center;gap:12px 20px;padding:16px 22px;border-radius:26px;
  background:linear-gradient(115deg,var(--hero-1),var(--hero-2));color:var(--hero-ink);box-shadow:0 6px 0 rgba(0,0,0,.14)}
.top .deco{position:absolute;inset:0;pointer-events:none;opacity:.22}
.brand{display:flex;align-items:center;gap:14px;min-width:0;position:relative}
.logo{width:68px;height:68px;flex:none;animation:bob 3.2s ease-in-out infinite}
.brand h1{font-size:1.8rem;font-weight:800;letter-spacing:.01em}
.brand .sub{font-size:.8rem;letter-spacing:.16em;text-transform:uppercase;font-weight:700;opacity:.9}
.top .meta{display:flex;flex-wrap:wrap;gap:8px;align-items:center;position:relative}
.top .right{margin-left:auto;display:flex;flex-direction:column;align-items:flex-end;gap:8px;position:relative;min-width:0}
.pill{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:3px 12px;font-size:.8rem;font-weight:700;border:2px solid var(--line);background:var(--surface);white-space:nowrap}
.top .pill{background:rgba(255,255,255,.16);border-color:rgba(255,255,255,.35);color:var(--hero-ink)}
.pill .dot{width:9px;height:9px;border-radius:50%;background:var(--muted)}
.top .pill .dot{box-shadow:0 0 0 2px rgba(255,255,255,.5)}
.pill.demo,.top .pill.demo{background:var(--folder);color:#3d2a00;border-color:transparent}
.pill.ai-ready .dot{background:var(--ok)} .pill.ai-off .dot{background:var(--folder)}

/* nhạc nền */
.music{display:flex;flex-wrap:wrap;gap:6px;align-items:center;justify-content:flex-end;background:rgba(255,255,255,.14);border:2px solid rgba(255,255,255,.3);border-radius:16px;padding:5px 6px}
.mbtn{display:inline-flex;align-items:center;gap:7px;border:0;border-radius:11px;padding:6px 12px;font-weight:800;cursor:pointer;background:var(--hero-ink);color:var(--hero-2);box-shadow:0 3px 0 rgba(0,0,0,.2);white-space:nowrap;font-family:var(--f-display);font-size:.98rem}
.mbtn:active{transform:translateY(2px);box-shadow:0 1px 0 rgba(0,0,0,.2)}
.mbtn.on{background:var(--folder);color:#3d2a00}
.mbtn.ghost{background:transparent;color:var(--hero-ink);box-shadow:none;border:2px solid rgba(255,255,255,.35);padding:4px 10px;font-size:.88rem}
.mbtn.ghost[aria-pressed="false"]{opacity:.7;text-decoration:line-through}
.music select{width:auto;border-radius:10px;border:2px solid rgba(255,255,255,.35);background:rgba(255,255,255,.95);color:#1b2559;padding:4px 8px;font-weight:700;font-size:.86rem}
.music input[type=range]{width:96px;accent-color:var(--folder)}
.eq{display:inline-flex;gap:2px;align-items:flex-end;height:14px}
.eq i{width:3px;height:100%;background:currentColor;border-radius:2px;transform-origin:bottom;animation:eq .9s ease-in-out infinite}
.eq i:nth-child(2){animation-delay:.2s}.eq i:nth-child(3){animation-delay:.45s}

/* khung chính */
.shell{max-width:1320px;margin:0 auto;display:grid;grid-template-columns:246px minmax(0,1fr);gap:22px;align-items:start}
nav.steps{position:sticky;top:max(12px,env(safe-area-inset-top,0px));display:flex;flex-direction:column;gap:6px;background:var(--surface);border:2px solid var(--line);border-radius:22px;padding:10px;box-shadow:0 5px 0 var(--line-strong)}
nav.steps button{display:flex;align-items:center;gap:11px;text-align:left;border:0;background:transparent;border-radius:14px;padding:8px 10px;cursor:pointer;font-weight:700;color:var(--fg);font-family:var(--f-display);font-size:1.04rem;transition:background .15s,transform .15s}
nav.steps button:hover{background:var(--vcs)}
nav.steps button:hover .n{transform:rotate(-8deg) scale(1.08)}
nav.steps button[aria-current="page"]{background:var(--vc);color:var(--on-color);box-shadow:0 4px 0 rgba(0,0,0,.18)}
nav.steps .n{width:36px;height:36px;flex:none;border-radius:12px;display:grid;place-items:center;background:var(--vcs);color:var(--vc);transition:transform .2s}
nav.steps .n svg{width:21px;height:21px}
nav.steps button[aria-current="page"] .n{background:rgba(255,255,255,.25);color:var(--on-color)}
nav.steps .sep{height:2px;background:var(--line);margin:4px 6px;border-radius:2px}
main{min-width:0;display:flex;flex-direction:column;gap:18px}
main.enter>*{animation:rise .35s ease-out both}
main.enter>*:nth-child(2){animation-delay:.05s} main.enter>*:nth-child(3){animation-delay:.1s} main.enter>*:nth-child(n+4){animation-delay:.15s}
.view-head{display:flex;flex-wrap:wrap;align-items:center;gap:12px 16px}
.vh-icon{width:64px;height:64px;flex:none;border-radius:20px;display:grid;place-items:center;background:var(--vc);color:var(--on-color);box-shadow:0 5px 0 rgba(0,0,0,.16);transform:rotate(-4deg)}
.vh-icon svg{width:36px;height:36px}
.view-head p{max-width:70ch;color:var(--muted)}
.view-head .grow{flex:1 1 380px;display:flex;flex-direction:column;gap:4px;min-width:0}
.eyebrow{align-self:flex-start;font-size:.78rem;letter-spacing:.1em;text-transform:uppercase;font-weight:800;color:var(--vc,var(--accent));background:var(--vcs,var(--accent-soft));border-radius:999px;padding:2px 12px}

.panel{background:var(--surface);border:2px solid var(--line);border-radius:22px;padding:20px;display:flex;flex-direction:column;gap:14px;min-width:0;box-shadow:0 5px 0 var(--line-strong)}
.panel.flat{background:transparent;border-style:dashed;box-shadow:none}
.panel-title{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.panel-title h3{flex:1 1 auto}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.stack{display:flex;flex-direction:column;gap:10px;min-width:0}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}

/* form */
.fields{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px 16px}
.field{display:flex;flex-direction:column;gap:5px;min-width:0}
.field.full{grid-column:1/-1}
.field label{font-weight:700;font-size:.92rem}
.field .help{font-size:.8rem;color:var(--muted)}
.field .err{font-size:.82rem;color:var(--bad);font-weight:700}
input[type=text],input[type=number],select,textarea{width:100%;background:var(--surface-2);border:2px solid var(--line);border-radius:12px;padding:9px 12px;min-width:0;transition:border-color .15s,background .15s}
input[type=text]:focus,input[type=number]:focus,select:focus,textarea:focus{border-color:var(--accent);background:var(--surface);outline:none;box-shadow:0 0 0 4px var(--accent-soft)}
textarea{resize:vertical;min-height:72px;line-height:1.5}
input.invalid,select.invalid,textarea.invalid{border-color:var(--bad);background:var(--bad-soft)}
input[type=checkbox]{width:20px;height:20px;accent-color:var(--ok);cursor:pointer}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;border-radius:14px;padding:9px 16px;font-weight:800;cursor:pointer;border:2px solid var(--line-strong);background:var(--surface);color:var(--fg);white-space:nowrap;box-shadow:0 3px 0 var(--line-strong);font-family:var(--f-display);font-size:1rem;transition:transform .08s,filter .15s}
.btn:hover{filter:brightness(1.04);transform:translateY(-1px)}
.btn:active{transform:translateY(2px);box-shadow:0 1px 0 var(--line-strong)}
.btn.primary{background:var(--accent);border-color:var(--accent-2);color:var(--accent-ink);box-shadow:0 3px 0 var(--accent-2)}
.btn.primary:active{box-shadow:0 1px 0 var(--accent-2)}
.btn.ai{background:var(--ai);border-color:var(--ai-2);color:var(--accent-ink);box-shadow:0 3px 0 var(--ai-2)}
.btn.danger{color:var(--bad);border-color:var(--bad)}
.btn.sm{padding:4px 11px;font-size:.88rem;border-radius:11px}
.btn[disabled]{opacity:.45;cursor:not-allowed;filter:none;transform:none}

.chip{display:inline-flex;align-items:center;gap:5px;border-radius:999px;padding:2px 10px;font-size:.78rem;font-weight:800;letter-spacing:.02em;background:var(--surface-2);color:var(--muted);white-space:nowrap}
.chip.may{background:var(--accent-soft);color:var(--accent)}
.chip.may::before{content:"🖥️";font-size:.85em}
.chip.tc{background:var(--folder-soft);color:var(--folder-ink)}
.chip.tc::before{content:"💬";font-size:.85em}
.chip.ok{background:var(--ok-soft);color:var(--ok)}
.chip.warn{background:var(--warn-soft);color:var(--warn)}
.chip.bad{background:var(--bad-soft);color:var(--bad)}
.chip.ai{background:var(--ai-soft);color:var(--ai)}
.chip.lv-co-ban{background:var(--ok-soft);color:var(--ok)}
.chip.lv-co-ban::before{content:"★";}
.chip.lv-van-dung{background:var(--accent-soft);color:var(--accent)}
.chip.lv-van-dung::before{content:"★★";}
.chip.lv-mo-rong{background:var(--pink-soft);color:var(--pink)}
.chip.lv-mo-rong::before{content:"★★★";}

.notice{border-radius:16px;padding:11px 14px;font-size:.92rem;display:flex;gap:11px;align-items:flex-start;border:2px solid transparent}
.notice b{font-weight:700}
.notice::before{font-weight:800;font-family:var(--f-display);flex:none;width:24px;height:24px;border-radius:50%;display:grid;place-items:center;color:var(--on-color);font-size:.9rem;line-height:1}
.notice.warn{background:var(--warn-soft);border-color:var(--warn)} .notice.warn::before{content:"!";background:var(--warn)}
.notice.bad{background:var(--bad-soft);border-color:var(--bad)} .notice.bad::before{content:"×";background:var(--bad)}
.notice.info{background:var(--accent-soft);border-color:var(--accent)} .notice.info::before{content:"i";background:var(--accent)}
.notice.ok{background:var(--ok-soft);border-color:var(--ok)} .notice.ok::before{content:"✓";background:var(--ok)}
.notice.ai{background:var(--ai-soft);border-color:var(--ai)} .notice.ai::before{content:"AI";background:var(--ai);font-size:.62rem}
.notice-list{display:flex;flex-direction:column;gap:8px}

/* thống kê */
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.stat{--sc:var(--accent);--scs:var(--accent-soft);background:var(--scs);border-radius:18px;padding:12px 15px;display:flex;flex-direction:column;gap:2px;min-width:0;border:2px solid transparent}
.stat:nth-child(4n+2){--sc:var(--orange);--scs:var(--orange-soft)}
.stat:nth-child(4n+3){--sc:var(--ok);--scs:var(--ok-soft)}
.stat:nth-child(4n+4){--sc:var(--pink);--scs:var(--pink-soft)}
.stat .v{font-family:var(--f-display);font-size:1.9rem;font-weight:800;line-height:1.1;font-variant-numeric:tabular-nums;color:var(--sc)}
.stat .k{font-size:.84rem;color:var(--fg)}

/* bảng */
.tbl-wrap{overflow-x:auto;border:2px solid var(--line);border-radius:16px;background:var(--surface)}
table{border-collapse:collapse;width:100%;font-size:.9rem}
th,td{padding:9px 10px;border-bottom:2px solid var(--line);text-align:left;vertical-align:top}
th{background:var(--surface-2);font-weight:800;font-size:.84rem;white-space:nowrap;font-family:var(--f-display)}
tr:last-child td{border-bottom:0}
tbody tr:hover td{background:var(--surface-2)}
td.c,th.c{text-align:center}
.sched td{min-width:150px}
.sched td.rh{min-width:96px;white-space:nowrap;font-weight:800;font-family:var(--f-display);font-size:1rem}
.cell{display:flex;flex-direction:column;gap:4px;align-items:flex-start}
.cell .t{font-size:.8rem;color:var(--muted);line-height:1.35}
.cell .op{font-size:.8rem;font-weight:600}
.roles-mx td{min-width:62px;text-align:center}
.roles-mx td.lbl{text-align:left;min-width:120px}
.roles-mx input{padding:4px 8px;font-size:.86rem}
.rtag{display:inline-block;border-radius:8px;padding:1px 7px;font-size:.78rem;font-weight:800;margin:1px;font-family:var(--f-display)}
.rtag.r1{background:var(--accent);color:var(--on-color)}
.rtag.r2{background:var(--folder);color:#3d2a00}
.rtag.r3{background:var(--ok);color:var(--on-color)}
.rtag.r4{background:var(--pink);color:var(--on-color)}
.rtag.rx{background:var(--surface-2);color:var(--muted)}

/* thẻ vai */
.role-cards{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.role-card{--rc:var(--accent);--rcs:var(--accent-soft);border:2px solid var(--rc);border-radius:18px;padding:14px;display:flex;flex-direction:column;gap:7px;font-size:.87rem;background:var(--rcs);position:relative}
.role-card:nth-child(2){--rc:var(--folder);--rcs:var(--folder-soft)}
.role-card:nth-child(3){--rc:var(--ok);--rcs:var(--ok-soft)}
.role-card:nth-child(4){--rc:var(--pink);--rcs:var(--pink-soft)}
.role-card h4{margin:0;font-size:1.08rem;display:flex;gap:8px;align-items:center}
.role-card .ricon{width:46px;height:46px;border-radius:14px;background:var(--surface);display:grid;place-items:center;font-size:1.6rem;box-shadow:0 3px 0 var(--rc)}

/* thẻ nhiệm vụ */
.tasks{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.task{background:var(--surface);border:2px solid var(--line);border-radius:20px;padding:16px 18px;display:flex;flex-direction:column;gap:8px;min-width:0;box-shadow:0 5px 0 var(--line-strong);position:relative}
.task.is-may{border-top:8px solid var(--accent)} .task.is-tc{border-top:8px solid var(--folder)}
.task h4{margin:0;font-size:1.12rem;font-weight:800;padding-right:34px}
.task::after{position:absolute;top:10px;right:14px;font-size:1.5rem}
.task.is-may::after{content:"🖥️"} .task.is-tc::after{content:"💬"}
.task ol,.task ul{margin:0;padding-left:22px;font-size:.92rem}
.task ol li::marker{font-weight:800;color:var(--accent);font-family:var(--f-display)}
.task.is-tc ol li::marker{color:var(--folder-2)}
.task .kv{font-size:.87rem}
.task .kv b{font-weight:700}
.task .hint{font-size:.85rem;background:var(--surface-2);border-radius:12px;padding:7px 10px;border:2px dashed var(--line)}
.task .src{font-size:.78rem;color:var(--muted)}
.filters{display:flex;flex-wrap:wrap;gap:6px}
.seg{display:inline-flex;border:2px solid var(--line-strong);border-radius:13px;overflow:hidden;background:var(--surface)}
.seg button{border:0;background:transparent;padding:6px 12px;font-weight:700;font-size:.86rem;cursor:pointer;color:var(--muted)}
.seg button+button{border-left:2px solid var(--line)}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.seg.status button[aria-pressed="true"][data-v="chua"]{background:var(--surface-2);color:var(--fg)}
.seg.status button[aria-pressed="true"][data-v="dang"]{background:var(--folder);color:#3d2a00}
.seg.status button[aria-pressed="true"][data-v="xong"]{background:var(--ok);color:var(--on-color)}
.seg.status button[aria-pressed="true"][data-v="xong"]::before{content:"✓ "}

/* tiến độ */
.runbar{display:flex;flex-wrap:wrap;gap:14px 22px;align-items:center}
.clock{position:relative;width:132px;height:132px;flex:none;display:grid;place-items:center}
.clock svg{position:absolute;inset:0;width:100%;height:100%;transform:rotate(-90deg)}
.clock .ring-bg{fill:var(--surface-2);stroke:var(--line);stroke-width:10}
.clock .ring{fill:none;stroke:var(--ok);stroke-width:10;stroke-linecap:round;stroke-dasharray:100;transition:stroke-dashoffset .5s linear,stroke .3s}
.clock.low .ring{stroke:var(--folder)}
.clock.over .ring{stroke:var(--bad)}
.clock.over{animation:pulse 1s ease-in-out infinite}
.timer{position:relative;font-family:var(--f-display);font-size:2.2rem;font-weight:800;line-height:1;font-variant-numeric:tabular-nums}
.timer.over{color:var(--bad)}
.bar{height:16px;border-radius:99px;background:var(--surface-2);overflow:hidden;flex:none;width:100%;border:2px solid var(--line)}
.bar span{display:block;height:100%;background:repeating-linear-gradient(45deg,var(--ok) 0 10px,var(--ok-2) 10px 20px);border-radius:99px;transition:width .4s}
.gcards{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
.gcard{--gc:var(--accent);--gcs:var(--accent-soft);background:var(--surface);border:2px solid var(--line);border-top:10px solid var(--gc);border-radius:22px;padding:14px 16px;display:flex;flex-direction:column;gap:10px;min-width:0;box-shadow:0 5px 0 var(--line-strong)}
.gcard.flag{border-color:var(--bad);box-shadow:0 5px 0 var(--bad-2)}
.gcard.flag header h3::after{content:"🙋";margin-left:6px}
.gcard header{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.gcard header h3{flex:1 1 auto;font-size:1.3rem;display:flex;align-items:center;gap:8px}
.gav{width:34px;height:34px;border-radius:12px;background:var(--gc);color:var(--on-color);display:grid;place-items:center;font-size:1.1rem;flex:none}
.trow{display:flex;flex-direction:column;gap:5px;padding-top:9px;border-top:2px dashed var(--line)}
.trow .tt{font-size:.9rem;font-weight:600;display:flex;gap:6px;align-items:baseline;flex-wrap:wrap}
.gcard textarea{min-height:56px;font-size:.88rem}

/* AI */
.ai-layout{display:grid;grid-template-columns:290px minmax(0,1fr);gap:18px;align-items:start}
.ai-list{display:flex;flex-direction:column;gap:7px}
.ai-item{text-align:left;border:2px solid var(--line);background:var(--surface);border-radius:16px;padding:10px 13px;cursor:pointer;display:flex;flex-direction:column;gap:2px;box-shadow:0 3px 0 var(--line-strong);transition:transform .1s}
.ai-item:hover{transform:translateX(3px)}
.ai-item b{font-size:.95rem;font-family:var(--f-display);font-size:1.02rem}
.ai-item span{font-size:.8rem;color:var(--muted)}
.ai-item[aria-current="true"]{border-color:var(--ai);background:var(--ai-soft);box-shadow:0 3px 0 var(--ai-2)}
details.prompt summary{cursor:pointer;font-weight:700;font-size:.88rem;color:var(--ai)}
details.prompt pre{white-space:pre-wrap;word-break:break-word;background:var(--surface-2);border-radius:12px;padding:10px;font-size:.8rem;max-height:320px;overflow:auto;margin:8px 0 0}
.ai-out{border:2px solid var(--ai-soft);border-radius:16px;padding:14px;background:var(--surface-2);min-height:80px;font-size:.93rem}
.ai-out ul,.ai-out ol{margin:4px 0 8px;padding-left:22px}
.ai-out p{margin:0 0 6px}
.ai-out h4{margin:8px 0 4px;font-size:1.02rem}
.ai-out.thinking{color:var(--muted);font-style:italic}
.ai-out.thinking::before{content:"🤖 ";font-style:normal;display:inline-block;animation:bob 1s ease-in-out infinite}
.gen-task{border:2px solid var(--line);border-radius:14px;padding:10px 12px;display:flex;gap:10px;align-items:flex-start;background:var(--surface)}
.gen-task input{margin-top:5px}
.saved{border-left:4px solid var(--ai);padding:4px 0 4px 12px;display:flex;flex-direction:column;gap:4px}

.timeline{display:flex;flex-direction:column;gap:6px;font-size:.88rem}
.timeline div{display:flex;gap:10px}
.timeline time{color:var(--muted);font-variant-numeric:tabular-nums;flex:none;width:44px}

/* hộp thoại, thông báo, pháo giấy */
.modal-bg{position:fixed;inset:0;background:rgba(10,16,40,.5);display:grid;place-items:center;z-index:50;padding:16px}
.modal{background:var(--surface);border:2px solid var(--line);border-radius:24px;padding:22px;max-width:560px;width:100%;display:flex;flex-direction:column;gap:14px;box-shadow:var(--shadow);max-height:90vh;overflow:auto;animation:rise .25s ease-out}
.modal textarea{min-height:220px;font-size:.82rem}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(18px + env(safe-area-inset-bottom,0px));background:var(--fg);color:var(--bg);padding:10px 18px;border-radius:999px;font-weight:700;z-index:60;font-size:.92rem;max-width:calc(100% - 32px);box-shadow:var(--shadow);animation:rise .25s ease-out}
.confetti{position:fixed;inset:0;pointer-events:none;z-index:70;overflow:hidden}
.confetti i{position:absolute;top:-16px;width:10px;height:15px;border-radius:3px;animation:fall linear forwards}

.guide ol{margin:0;padding-left:22px;display:flex;flex-direction:column;gap:6px}
.guide p{max-width:72ch}

@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}

function makeGroups(L, prev){
  const S = L.students, G = L.groups, base = Math.floor(S / G), extra = S % G;
  const groups = []; let k = 1;
  const prevLabels = {};
  (prev || []).forEach(g => g.members.forEach(m => { prevLabels[m.code] = m.label; }));
  for (let i = 0; i < G; i++){
    const n = base + (i < extra ? 1 : 0), members = [];
    for (let j = 0; j < n; j++){ const code = "HS" + pad(k++); members.push({code, label: prevLabels[code] || code}); }
    groups.push({id:"g" + (i + 1), name:"Nhóm " + (i + 1), members});
  }
  return groups;
}

/* ============ Tính lịch luân phiên (quy tắc, không dùng AI) ============ */
function validateLesson(d){
  const e = {};
  const int = v => Number.isInteger(+v) && String(v).trim() !== "";
  if (!String(d.title || "").trim()) e.title = "Nhập tên bài học.";
  if (!String(d.goals || "").trim()) e.goals = "Nhập ít nhất một mục tiêu để trợ lý AI bám theo.";
  if (!int(d.students) || +d.students < 2 || +d.students > 60) e.students = "Sĩ số là số nguyên từ 2 đến 60.";
  if (!int(d.groups) || +d.groups < 1) e.groups = "Số nhóm là số nguyên từ 1 trở lên.";
  else if (!e.students && +d.groups > +d.students) e.groups = "Số nhóm không được lớn hơn sĩ số.";
  if (!int(d.computers) || +d.computers < 0 || +d.computers > 60) e.computers = "Số máy là số nguyên từ 0 đến 60.";
  if (!int(d.period) || +d.period < 20 || +d.period > 120) e.period = "Thời lượng tiết là số phút từ 20 đến 120.";
  if (!int(d.duration) || +d.duration < 4) e.duration = "Thời gian hoạt động nhóm tối thiểu 4 phút.";
  else if (!e.period && +d.duration > +d.period) e.duration = "Thời gian hoạt động nhóm không được dài hơn tiết học.";
  if (!int(d.slot) || +d.slot < 2) e.slot = "Mỗi lượt tối thiểu 2 phút.";
  else if (!e.duration && +d.slot > +d.duration) e.slot = "Mỗi lượt không được dài hơn thời gian hoạt động nhóm.";
  return e;
}
function numLesson(d){ return {...d, students:+d.students, groups:+d.groups, computers:+d.computers, period:+d.period, duration:+d.duration, slot:+d.slot}; }

function pack(list, nSlots, cap){
  const slots = []; let i = 0;
  for (let k = 0; k < nSlots; k++){
    const cur = []; let used = 0;
    while (i < list.length){
      const m = Math.max(1, +list[i].minutes || cap);
      if (cur.length === 0 || used + m <= cap){ cur.push(list[i].id); used += m; i++; if (used >= cap) break; }
      else break;
    }
    slots.push(cur);
  }
  return {slots, left:list.slice(i).map(t => t.id)};
}

function buildPlan(L, groups, tasksFor){
  const G = groups.length, C = Math.max(0, L.computers), R = Math.max(1, Math.floor(L.duration / L.slot));
  const allMachine = C >= G;
  const rounds = [], turns = {};
  groups.forEach(g => turns[g.id] = 0);
  let p = 0;
  for (let r = 0; r < R; r++){
    let chosen = [];
    if (C > 0){ if (allMachine) chosen = groups.map((g, i) => i); else { for (let k = 0; k < C; k++) chosen.push((p + k) % G); p = (p + C) % G; } }
    const cells = {};
    groups.forEach((g, i) => {
      const k = chosen.indexOf(i);
      cells[g.id] = k >= 0 ? {mode:"may", machine:k + 1, offset:turns[g.id], taskIds:[]} : {mode:"tai-cho", offset:turns[g.id], taskIds:[]};
      if (k >= 0) turns[g.id]++;
    });
    rounds.push({idx:r, start:r * L.slot, end:(r + 1) * L.slot, cells});
  }
  const left = {};
  if (tasksFor) groups.forEach(g => {
    const ts = tasksFor(g.id), may = ts.filter(t => t.type === "may"), tc = ts.filter(t => t.type !== "may");
    const mr = rounds.filter(r => r.cells[g.id].mode === "may"), tr = rounds.filter(r => r.cells[g.id].mode !== "may");
    const pm = pack(may, mr.length, L.slot); mr.forEach((r, k) => r.cells[g.id].taskIds = pm.slots[k]);
    const pt = pack(tc, tr.length, L.slot); tr.forEach((r, k) => r.cells[g.id].taskIds = pt.slots[k]);
    left[g.id] = {may:pm.left, tc:allMachine ? [] : pt.left};
  });
  return {R, C, G, allMachine, rounds, turns, left};
}

function roleMap(group, offset, nRoles){
  // trả về mảng theo thành viên: danh sách chỉ số vai
  const n = group.members.length, res = group.members.map(() => []);
  if (!n) return res;
  for (let k = 0; k < nRoles; k++) res[(k + offset) % n].push(k);
  return res;
}

function planWarnings(L, groups, plan){
  const W = [];
  const sizes = groups.map(g => g.members.length), maxS = Math.max(...sizes), minS = Math.min(...sizes);
  if (plan.C === 0) W.push({k:"bad", t:"Chưa có máy tính nào: mọi lượt đều là hoạt động tại chỗ. Hãy nhập số máy dùng được."});
  if (plan.C > plan.G) W.push({k:"info", t:`Có ${plan.C} máy cho ${plan.G} nhóm: thừa ${plan.C - plan.G} máy. Có thể tăng số nhóm (nhóm nhỏ hơn) để nhiều bạn được thao tác hơn.`});
  if (maxS > 6) W.push({k:"warn", t:`Nhóm đông (tối đa ${maxS} bạn/nhóm). Với 1 máy/nhóm, nhóm trên 6 bạn khó quan sát màn hình trong phòng chật.`});
  if (minS < 2) W.push({k:"warn", t:"Có nhóm chỉ 1 bạn, không thể phân vai. Hãy giảm số nhóm."});
  const tv = Object.values(plan.turns), tmax = Math.max(...tv), tmin = Math.min(...tv);
  if (plan.C > 0 && tmax !== tmin){
    // số lượt R' chia đều khi R' × số máy chia hết cho số nhóm
    const fairR = []; for (let r = 1; r <= 24; r++) if ((r * plan.C) % plan.G === 0 && L.duration / r >= 3) fairR.push(r);
    const bestR = fairR.sort((a, b) => Math.abs(a - plan.R) - Math.abs(b - plan.R))[0];
    const fairG = []; for (let g = 2; g <= L.students; g++) if ((plan.R * plan.C) % g === 0 && g < plan.C * plan.R && L.students / g >= 2 && L.students / g <= 6) fairG.push(g);
    const bestG = fairG.sort((a, b) => Math.abs(a - plan.G) - Math.abs(b - plan.G))[0];
    const tips = [];
    if (bestR) tips.push(`chia ${bestR} lượt (mỗi lượt khoảng ${Math.floor(L.duration / bestR)} phút), mỗi nhóm được ${bestR * plan.C / plan.G} lượt máy`);
    if (bestG) tips.push(`chia ${bestG} nhóm, mỗi nhóm được ${plan.R * plan.C / bestG} lượt máy`);
    W.push({k:"warn", t:`Số lượt máy chưa đều: có nhóm ${tmax} lượt, có nhóm ${tmin} lượt.` + (tips.length ? ` Gợi ý: ${tips.join("; hoặc ")}.` : "")});
  }
  if (plan.C > 0){
    const lacking = groups.filter(g => Math.min(g.members.length, plan.turns[g.id]) < g.members.length);
    if (lacking.length){
      const g = lacking[0], t = plan.turns[g.id], n = g.members.length;
      const per = t > 0 ? Math.ceil(n / t) : n, mins = t > 0 ? Math.max(1, Math.floor(L.slot / per)) : 0;
      W.push({k:"warn", t:`${lacking.length} nhóm chưa đủ lượt để mọi bạn làm “Người thao tác chính” (ví dụ ${g.name}: ${t} lượt máy / ${n} bạn).` +
        (t > 0 ? ` Gợi ý: trong mỗi lượt máy, đổi người cầm chuột khoảng ${mins} phút/lần để ${per} bạn cùng được thao tác.` : "")});
    }
  }
  const leftMay = [];
  groups.forEach(g => (plan.left[g.id]?.may || []).forEach(id => leftMay.push([g.name, id])));
  if (leftMay.length){
    const ids = [...new Set(leftMay.map(x => x[1]))], names = ids.map(id => "“" + (taskById(id)?.title || id) + "”");
    const gs = [...new Set(leftMay.map(x => x[0]))];
    W.push({k:"bad", t:`Không đủ thời gian máy: ${names.join(", ")} chưa xếp được vào lượt máy của ${gs.length === groups.length ? "tất cả các nhóm" : gs.join(", ")}. Gợi ý: tăng thời gian hoạt động, giảm số nhóm hoặc chuyển phần còn lại sang tiết sau.`});
  }
  const leftTc = new Set(); groups.forEach(g => (plan.left[g.id]?.tc || []).forEach(id => leftTc.add(id)));
  if (leftTc.size) W.push({k:"info", t:`${leftTc.size} nhiệm vụ tại chỗ chưa có lượt riêng; dùng làm nhiệm vụ dự phòng khi nhóm xong sớm.`});
  if (L.duration > L.period - 5) W.push({k:"warn", t:`Hoạt động nhóm ${L.duration} phút trong tiết ${L.period} phút: còn dưới 5 phút cho khởi động và tổng kết.`});
  if (L.slot < 4) W.push({k:"warn", t:"Mỗi lượt dưới 4 phút: học sinh tiểu học khó kịp đổi chỗ thao tác và hoàn thành một bước."});
  return W;
}

function alternatives(L){
  const S = L.students, C = L.computers, cands = new Set();
  if (C > 0) [C, 2 * C, 3 * C].forEach(g => cands.add(g));
  [Math.ceil(S / 4), Math.ceil(S / 5), Math.ceil(S / 6)].forEach(g => cands.add(g));
  const out = [];
  [...cands].filter(g => g >= 1 && g <= S).sort((a, b) => a - b).forEach(G => {
    const lo = Math.floor(S / G), hi = Math.ceil(S / G);
    if (lo < 3 || hi > 6) return;
    const groups = makeGroups({...L, groups:G}), plan = buildPlan({...L, groups:G}, groups, null);
    const tv = Object.values(plan.turns);
    let covered = 0; groups.forEach(g => covered += Math.min(g.members.length, plan.turns[g.id]));
    out.push({G, size: lo === hi ? `${lo}` : `${lo}–${hi}`, tmin:Math.min(...tv), tmax:Math.max(...tv), cover:Math.round(100 * covered / S), waves: C > 0 ? Math.ceil(G / Math.min(C, G)) : 0});
  });
  return out;
}

/* ============ Truy vấn trạng thái ============ */
const taskById = id => state.tasks.find(t => t.id === id);
const tasksFor = gid => state.tasks.filter(t => (state.assign[gid] || []).includes(t.id));
const st = (gid, tid) => state.progress[gid + "|" + tid]?.status || "chua";
function plan(){ return buildPlan(state.lesson, state.groups, tasksFor); }
function curRound(p){ return Math.min(Math.max(0, state.run.round - 1), p.R - 1); }
function groupPace(g, p){
  const cur = curRound(p), ts = tasksFor(g.id);
  const done = ts.filter(t => st(g.id, t.id) === "xong").length;
  const due = []; p.rounds.slice(0, cur).forEach(r => (r.cells[g.id].taskIds || []).forEach(id => due.push(id)));
  const lag = due.filter(id => st(g.id, id) !== "xong").length;
  if (ts.length && done === ts.length) return {k:"ok", t: cur < p.R - 1 ? "Xong sớm" : "Hoàn thành", early: cur < p.R - 1, done, total:ts.length, lag:0};
  if (lag > 0) return {k:"bad", t:`Chậm ${lag} nhiệm vụ`, done, total:ts.length, lag};
  return {k:"ok", t:"Đúng tiến độ", done, total:ts.length, lag:0};
}

    `- Tiết học ${L.period} phút; thời gian hoạt động nhóm ${L.duration} phút, chia ${p.R} lượt × ${L.slot} phút.\n` +
    `- Cách tổ chức: mỗi nhóm dùng chung 1 máy khi đến lượt; nhóm chưa đến lượt làm nhiệm vụ tại chỗ, không rời ghế (phòng máy chật).\n` +

  p.rounds.forEach(r => {
    s += `- Lượt ${r.idx + 1} (phút ${r.start}–${r.end}): ` + state.groups.map(g => { const c = r.cells[g.id]; return `${g.name} ${c.mode === "may" ? "máy " + c.machine : "tại chỗ"}`; }).join(", ") + "\n";

function ctxProgress(){

function setupPreview(){
  const e = validateLesson(draft);
  if (Object.keys(e).length) return `<div class="panel-title"><h3>Gợi ý phương án tổ chức</h3><span class="chip">Tính theo quy tắc</span></div><div class="notice bad"><span>Hãy sửa các ô đang báo lỗi để xem phương án.</span></div>`;
  const L = numLesson(draft), groups = makeGroups(L), p = buildPlan(L, groups, null);
  const W = planWarnings(L, groups, p).filter(w => !/chưa xếp được|nhiệm vụ tại chỗ chưa có lượt/.test(w.t));
  const tv = Object.values(p.turns);
  let covered = 0; groups.forEach(g => covered += Math.min(g.members.length, p.turns[g.id]));
  const alts = alternatives(L);
  return `<div class="panel-title"><h3>Gợi ý phương án tổ chức</h3><span class="chip">Tính theo quy tắc, không dùng AI</span></div>

      <div class="stat"><span class="v">${L.computers >= L.groups ? "Cả lớp" : Math.ceil(L.groups / Math.max(1, L.computers)) + " đợt"}</span><span class="k">${L.computers >= L.groups ? "mọi nhóm có máy cùng lúc" : "các nhóm luân phiên dùng " + L.computers + " máy"}</span></div>
      <div class="stat"><span class="v">${Math.min(...tv) === Math.max(...tv) ? tv[0] : Math.min(...tv) + "–" + Math.max(...tv)}</span><span class="k">lượt máy mỗi nhóm</span></div>
      <div class="stat"><span class="v">${covered}/${L.students}</span><span class="k">học sinh được làm “Người thao tác chính” theo lịch</span></div>
    </div>
    ${notices(W)}

    <div class="tbl-wrap"><table><thead><tr><th>Số nhóm</th><th>HS/nhóm</th><th>Lượt máy/nhóm</th><th>Được thao tác</th><th></th></tr></thead><tbody>

    </tbody></table></div><p class="small muted">Chỉ liệt kê cách chia 3–6 bạn/nhóm. “Được thao tác” là tỉ lệ học sinh có ít nhất một lượt làm Người thao tác chính theo lịch.</p></div>` : ""}`;
}

  if (ring) ring.style.strokeDashoffset = String(100 - 100 * Math.max(0, Math.min(full, s)) / full);

/* ============ Nhạc nền và âm thanh (tự tạo bằng Web Audio, không dùng tệp nhạc bên ngoài) ============ */
const SOUND_KEY = "smart-ict-classroom-sound";
const MOODS = {
  vui: {name:"Vui tươi", bpm:112, prog:[[60,64,67],[67,71,74],[69,72,76],[65,69,72]], rhythm:[1,0,1,1,0,1,1,0], seed:7},
  nhe: {name:"Nhẹ nhàng", bpm:84, prog:[[60,64,67],[57,60,64],[65,69,72],[67,71,74]], rhythm:[1,0,0,1,0,0,1,0], seed:3},
  tap: {name:"Tập trung", bpm:64, prog:[[57,60,64],[53,57,60],[60,64,67],[55,59,62]], rhythm:[1,0,0,0,0,1,0,0], seed:11}
};
const music = {ctx:null, master:null, sfxGain:null, bus:null, noise:null, playing:false, mood:"vui", vol:60, fx:true, timer:null, step:0, next:0, melody:{}};
try { const o = JSON.parse(localStorage.getItem(SOUND_KEY) || "{}");
  if (MOODS[o.mood]) music.mood = o.mood; if (o.vol >= 0 && o.vol <= 100) music.vol = o.vol; if (typeof o.fx === "boolean") music.fx = o.fx; } catch(e){}
function saveSound(){ try { localStorage.setItem(SOUND_KEY, JSON.stringify({mood:music.mood, vol:music.vol, fx:music.fx})); } catch(e){} }
const mtof = m => 440 * Math.pow(2, (m - 69) / 12);
function audio(){
  if (!music.ctx){
    const AC = window.AudioContext || window.webkitAudioContext; if (!AC) return null;
    const c = new AC(), comp = c.createDynamicsCompressor(); comp.connect(c.destination);
    music.master = c.createGain(); music.master.gain.value = music.vol / 100 * 0.6; music.master.connect(comp);
    music.sfxGain = c.createGain(); music.sfxGain.gain.value = 0.55; music.sfxGain.connect(comp);
    const buf = c.createBuffer(1, c.sampleRate * 0.2, c.sampleRate), d = buf.getChannelData(0);
    for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
    music.noise = buf; music.ctx = c;
  }
  if (music.ctx.state === "suspended") music.ctx.resume();
  return music.ctx;
}
function tone(dest, t, midi, dur, vol, type = "triangle", attack = 0.008){
  const c = music.ctx, o = c.createOscillator(), g = c.createGain();
  o.type = type; o.frequency.value = mtof(midi);
  g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(vol, t + attack); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  o.connect(g); g.connect(dest); o.start(t); o.stop(t + dur + 0.05);
}
function padChord(dest, t, notes, dur, vol){
  const c = music.ctx;
  notes.forEach(m => [-6, 6].forEach(dt => {
    const o = c.createOscillator(), g = c.createGain(); o.type = "sine"; o.frequency.value = mtof(m); o.detune.value = dt;
    g.gain.setValueAtTime(0.0001, t); g.gain.linearRampToValueAtTime(vol, t + dur * 0.35); g.gain.linearRampToValueAtTime(0.0001, t + dur);
    o.connect(g); g.connect(dest); o.start(t); o.stop(t + dur + 0.05);
  }));
}
function hat(dest, t, vol){
  const c = music.ctx, s = c.createBufferSource(), f = c.createBiquadFilter(), g = c.createGain();
  s.buffer = music.noise; f.type = "highpass"; f.frequency.value = 7000;
  g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0001, t + 0.05);

}
// Giai điệu ngũ cung sinh từ hạt giống cố định: lặp lại giống nhau mỗi lần nghe
function melodyFor(id){
  if (music.melody[id]) return music.melody[id];
  const M = MOODS[id], scale = [60, 62, 64, 67, 69, 72, 74, 76, 79]; let x = M.seed, idx = 4; const out = [];
  const rnd = () => (x = (x * 1103515245 + 12345) % 2147483648) / 2147483648;
  for (let i = 0; i < 64; i++){
    const bar = Math.floor(i / 8) % 4, s = i % 8, chord = M.prog[bar];
    if (!M.rhythm[s] && !(i >= 32 && s === 7 && rnd() < 0.5)){ out.push(null); continue; }
    if (s === 0){ const tgt = chord[Math.floor(rnd() * 3)] % 12; idx = scale.findIndex(n => n % 12 === tgt && n >= 64); if (idx < 0) idx = 4; }
    else idx = Math.max(0, Math.min(scale.length - 1, idx + [-2, -1, -1, 1, 1, 2][Math.floor(rnd() * 6)]));
    out.push(scale[idx]);
  }

}
function playStep(id, i, t, sd){
  const M = MOODS[id], bar = Math.floor(i / 8) % 4, s = i % 8, chord = M.prog[bar], mel = melodyFor(id)[i], b = music.bus;
  if (id === "vui"){
    if (mel) tone(b, t, mel, sd * 1.6, 0.13);
    if (s === 0 || s === 4) tone(b, t, chord[0] - 24, sd * 3, 0.24, "sine");
    if (s === 2 || s === 6) chord.forEach(m => tone(b, t, m, sd * 0.9, 0.035, "square"));
    if (s % 2 === 1) hat(b, t, 0.035);
  } else if (id === "nhe"){
    const arp = [0, 1, 2, 1, 0, 1, 2, 1][s]; tone(b, t, chord[arp] + 12, sd * 2.2, 0.075, "sine");
    if (mel) tone(b, t, mel, sd * 3, 0.07, "triangle");
    if (s === 0){ tone(b, t, chord[0] - 12, sd * 8, 0.16, "sine", 0.05); padChord(b, t, chord, sd * 8, 0.022); }
  } else {
    if (s === 0) padChord(b, t, chord.map(m => m - 12).concat(chord[1]), sd * 8.4, 0.03);

}
function schedule(){

}
function musicStart(){
  const c = audio(); if (!c){ toast("Trình duyệt này không phát được âm thanh."); return; }
  music.bus = c.createGain(); music.bus.gain.value = 1; music.bus.connect(music.master);

function musicStop(){
  clearInterval(music.timer); music.timer = null; music.playing = false;

  if (b && music.ctx){ const t = music.ctx.currentTime; b.gain.setValueAtTime(b.gain.value, t); b.gain.linearRampToValueAtTime(0.0001, t + 0.4); setTimeout(() => b.disconnect(), 700); }

}
// Hiệu ứng: chuông hết lượt, tiếng "ting" khi xong nhiệm vụ, nhạc mừng khi nhóm hoàn thành
function sfx(kind){

function md(text){
  const lines = esc(text).split(/\r?\n/), out = []; let list = null;
  const inl = s => s.replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>").replace(/`([^`]+)`/g, "<code>$1</code>");
  const close = () => { if (list){ out.push(list === "ul" ? "</ul>" : "</ol>"); list = null; } };
  for (const raw of lines){
    const l = raw.trimEnd(); let m;
    if ((m = l.match(/^\s*[-*•·]\s+(.*)/))){ if (list !== "ul"){ close(); out.push("<ul>"); list = "ul"; } out.push("<li>" + inl(m[1]) + "</li>"); continue; }
    if ((m = l.match(/^\s*(\d+)[.)]\s+(.*)/))){ if (list !== "ol"){ close(); out.push("<ol>"); list = "ol"; } out.push("<li>" + inl(m[2]) + "</li>"); continue; }
    close();
    if ((m = l.match(/^#{1,6}\s+(.*)/))) out.push("<h4>" + inl(m[1]) + "</h4>");
    else if (l.trim()) out.push("<p>" + inl(l) + "</p>");
  }
  close(); return out.join("");
}

function parseLooseJSON(text){
  try { return JSON.parse(text); } catch(e){}
  const f = text.match(/```(?:json)?\s*([\s\S]*?)```/); if (f){ try { return JSON.parse(f[1]); } catch(e){} }
  const a = text.indexOf("["), b = text.lastIndexOf("]"); if (a >= 0 && b > a) return JSON.parse(text.slice(a, b + 1));

}

async function runAI(){
  const A = AI_ACTIONS.find(a => a.id === aiSel), F = aiForm[A.id] || {};
  const miss = (A.fields || []).find(f => f.required && !String(F[f.id] || "").trim());

      const data = await ai.sample.json(prompt, {signal:ai.ctl.signal, modelTier:A.tier, cache:false});

    } else {

      aiOut[A.id] = {text:r.text, truncated:r.truncated, mode:"tu-dong"};
      log(`Dùng trợ lý AI: ${A.title}.`); save();
    }
  } catch(e){
    const code = e && e.code;
    const keep = e && e.text && !A.json ? e.text : "";
    if (code === "cancelled") aiOut[A.id] = keep ? {text:keep, mode:"tu-dong", truncated:true} : null;
    else {

      if (HIDE_CODES.includes(code)){ ai.state = "off"; }
    }
  } finally { ai.busy = false; ai.ctl = null; if (view === "ai") render(); }
}

function reportCSV(){
  const q = v => '"' + String(v ?? "").replace(/"/g, '""') + '"';
  const rows = [["Nhóm","Số HS","Nhiệm vụ","Hình thức","Mức độ","Trạng thái","Nhận xét nhóm"]];
  state.groups.forEach(g => tasksFor(g.id).forEach(t => rows.push([g.name, g.members.length, t.title, TYPES[t.type], LEVELS[t.level], STATUS[st(g.id, t.id)], state.notes[g.id] || ""])));
  return "\ufeff" + rows.map(r => r.map(q).join(",")).join("\r\n");
}
async function offerFile(filename, data){
  if (ai.downloads){
    try { await ai.downloads.save({filename, data}); toast("Đã tải " + filename); return; }
    catch(e){ if (e && e.code === "declined") return; }
  }
  if (!ai.framed){
    try { const a = document.createElement("a"); a.href = URL.createObjectURL(new Blob([data], {type:"text/plain;charset=utf-8"})); a.download = filename; document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 500); toast("Đã tải " + filename); return; } catch(e){}
  }
  modal(`<h3>Sao chép nội dung ${esc(filename)}</h3><p class="small muted">Trình xem này không cho tải tệp trực tiếp. Hãy sao chép nội dung dưới đây và lưu thành tệp <b>${esc(filename)}</b>.</p><textarea id="copy-area" readonly>${esc(data)}</textarea><div class="row"><button class="btn primary" data-act="copy-area">Sao chép</button><button class="btn" data-act="close-modal">Đóng</button></div>`);
}

function applySetup(){
  setupErrors = validateLesson(draft);
  if (Object.keys(setupErrors).length){ render(); toast("Còn thông tin thiếu hoặc chưa hợp lệ."); const k = Object.keys(setupErrors)[0]; document.getElementById("f-" + k)?.focus(); return; }
  const L = numLesson(draft), changedGroups = L.groups !== state.lesson.groups || L.students !== state.lesson.students;
  const doApply = () => {
    const oldAssign = state.assign[state.groups[0]?.id] || DEFAULT_ASSIGN;
    state.lesson = L;
    if (changedGroups){
      state.groups = makeGroups(L, state.groups); state.progress = {}; state.notes = {}; state.flags = {};
      const a = {}; state.groups.forEach(g => a[g.id] = (state.assign[g.id] || oldAssign).slice()); state.assign = a;
    }
    state.run = {round:1, remaining:null, endAt:null, running:false};
    log(`Áp dụng phương án: ${L.groups} nhóm, ${L.computers} máy, ${Math.floor(L.duration / L.slot)} lượt × ${L.slot} phút.`);
    save(); draft = null; toast("Đã áp dụng phương án"); go("groups");
  };
  const hasProgress = Object.keys(state.progress).length > 0;
  if (changedGroups && hasProgress) confirmBox("Sĩ số hoặc số nhóm thay đổi nên nhóm sẽ được chia lại và <b>tiến độ, nhận xét đã ghi sẽ bị xóa</b>.", "Áp dụng và chia lại nhóm", doApply);
  else doApply();
}
function startEdit(t){
  editing = t ? {...clone(t), stepsText:t.steps.join("\n")} : {_new:true, id:uid("t-gv"), title:"", type:"tai-cho", level:"co-ban", minutes:state.lesson.slot, role:"", stepsText:"", product:"", criteria:"", hint:"", source:"Giáo viên bổ sung"};
  render(); document.getElementById("editor")?.scrollIntoView({block:"start"}); document.getElementById("e-title")?.focus();
}
function saveEdit(){
  const t = editing, err = {};
  if (!t.title.trim()) err.title = "Nhập tên nhiệm vụ.";
  const m = Math.round(+t.minutes); if (!(m >= 1 && m <= 45)) err.minutes = "Thời gian từ 1 đến 45 phút.";
  const steps = t.stepsText.split("\n").map(s => s.trim()).filter(Boolean); if (!steps.length) err.steps = "Nhập ít nhất một bước.";
  if (Object.keys(err).length){ editing._err = err; render(); toast("Còn thông tin thiếu."); return; }
  const out = {id:t.id, type:t.type, level:t.level, minutes:m, role:t.role, source:t.source.trim(), title:t.title.trim(), steps, product:t.product.trim(), criteria:t.criteria.trim(), hint:t.hint.trim(), ai:t.ai};
  const i = state.tasks.findIndex(x => x.id === t.id);
  if (i >= 0) state.tasks[i] = out; else state.tasks.push(out);
  log(`${i >= 0 ? "Sửa" : "Thêm"} nhiệm vụ: ${out.title}.`);
  editing = null; save(); render(); toast("Đã lưu nhiệm vụ");
}

document.addEventListener("click", e => {
  const g = e.target.closest("[data-go]");
  if (g){ if (g.dataset.preset) aiSel = g.dataset.preset; go(g.dataset.go); return; }
  const b = e.target.closest("[data-act]"); if (!b) return;
  const a = b.dataset.act;
  if (a === "close-modal-bg"){ if (e.target === b) closeModal(); return; }
  switch (a){
    case "apply-setup": applySetup(); break;
    case "reset-draft": draft = clone(state.lesson); setupErrors = {}; render(); break;
    case "use-alt": draft.groups = +b.dataset.g; setupErrors = validateLesson(draft); render(); toast(`Đã chọn ${b.dataset.g} nhóm – bấm “Áp dụng phương án” để dùng.`); break;
    case "sel-group": groupSel = b.dataset.g; render(); break;
    case "filter": taskFilter[b.dataset.k] = b.dataset.v; render(); break;
    case "new-task": startEdit(null); break;
    case "edit-task": startEdit(taskById(b.dataset.id)); break;
    case "cancel-task": editing = null; render(); break;
    case "save-task": saveEdit(); break;
    case "del-task": { const t = taskById(b.dataset.id); confirmBox(`Xóa nhiệm vụ “${esc(t.title)}”? Trạng thái của nhiệm vụ này ở các nhóm cũng bị xóa.`, "Xóa nhiệm vụ", () => {
        state.tasks = state.tasks.filter(x => x.id !== t.id); Object.keys(state.assign).forEach(k => state.assign[k] = state.assign[k].filter(x => x !== t.id));
        Object.keys(state.progress).forEach(k => { if (k.endsWith("|" + t.id)) delete state.progress[k]; }); log(`Xóa nhiệm vụ: ${t.title}.`); save(); render(); }); break; }
    case "mv": { const i = state.tasks.findIndex(x => x.id === b.dataset.id), j = i + (+b.dataset.d); if (j < 0 || j >= state.tasks.length) break; [state.tasks[i], state.tasks[j]] = [state.tasks[j], state.tasks[i]]; save(); render(); break; }
    case "status": { const key = b.dataset.g + "|" + b.dataset.t, prev = st(b.dataset.g, b.dataset.t);
      if (prev === b.dataset.v) break;
      state.progress[key] = {status:b.dataset.v, at:Date.now()};
      const gn = state.groups.find(x => x.id === b.dataset.g)?.name, tn = taskById(b.dataset.t)?.title;
      log(`${gn}: “${tn}” → ${STATUS[b.dataset.v]}.`); save(); render();
      if (b.dataset.v === "xong"){ const ts = tasksFor(b.dataset.g);
        if (ts.length && ts.every(x => st(b.dataset.g, x.id) === "xong")){ sfx("fanfare"); confetti(); toast(`🎉 ${gn} đã hoàn thành tất cả nhiệm vụ!`); }
        else sfx("ding"); }
      break; }
    case "music-toggle": music.playing ? musicStop() : musicStart(); break;
    case "fx-toggle": music.fx = !music.fx; saveSound(); renderMusic(); if (music.fx){ audio(); sfx("ding"); } break;
    case "flag": state.flags[b.dataset.g] = !state.flags[b.dataset.g]; log(`${state.groups.find(x => x.id === b.dataset.g)?.name}: ${state.flags[b.dataset.g] ? "đánh dấu cần hỗ trợ" : "bỏ đánh dấu cần hỗ trợ"}.`); save(); render(); break;
    case "timer-toggle": { const r = state.run;
      if (r.running){ r.remaining = remaining(); r.running = false; r.endAt = null; }
      else { r.endAt = Date.now() + remaining() * 1000; r.running = true; log(`Bắt đầu Lượt ${r.round}.`); startTimerLoop(); if (music.fx){ audio(); sfx("start"); } }
      save(); render(); break; }
    case "timer-reset": state.run.remaining = null; state.run.endAt = state.run.running ? Date.now() + state.lesson.slot * 60000 : null; save(); tick(); break;
    case "next-round": { const p = plan(); if (state.run.round >= p.R) break; state.run.round++; state.run.remaining = null; state.run.endAt = state.run.running ? Date.now() + state.lesson.slot * 60000 : null; log(`Chuyển sang Lượt ${state.run.round}.`); save(); render(); break; }
    case "ai-sel": aiSel = b.dataset.id; render(); break;
    case "ai-run": runAI(); break;
    case "ai-stop": ai.ctl?.abort(); break;
    case "ai-copy": { const A = AI_ACTIONS.find(x => x.id === aiSel); const text = A.build(aiForm[A.id] || {});
      (navigator.clipboard?.writeText(text) || Promise.reject()).then(() => toast("Đã sao chép yêu cầu"), () => { const d = document.querySelector("details.prompt"); if (d) d.open = true; const pre = document.getElementById("ai-prompt"); if (pre){ const rg = document.createRange(); rg.selectNodeContents(pre); const s = getSelection(); s.removeAllRanges(); s.addRange(rg); } toast("Không sao chép tự động được: đã bôi đen nội dung, hãy nhấn Ctrl+C."); }); break; }
    case "ai-manual-use": { const A = AI_ACTIONS.find(x => x.id === aiSel), txt = (aiManual[A.id] || "").trim();
      if (!txt){ toast("Hãy dán câu trả lời trước."); document.getElementById("ai-manual")?.focus(); break; }
      if (A.json){ try { aiOut[A.id] = {text:"", tasks:normTasks(parseLooseJSON(txt)), mode:"thu-cong"}; } catch(err){ aiOut[A.id] = {text:txt, mode:"thu-cong", error:"Không đọc được danh sách nhiệm vụ trong câu trả lời đã dán. Có thể vẫn lưu nội dung vào báo cáo."}; } }
      else aiOut[A.id] = {text:txt, mode:"thu-cong"};
      render(); break; }
    case "ai-save": { const A = AI_ACTIONS.find(x => x.id === aiSel), o = aiOut[A.id]; if (!o?.text) break;
      state.aiLog.push({id:uid("ai"), action:A.id, title:A.title, at:Date.now(), mode:o.mode, output:o.text}); o.saved = true; log(`Lưu gợi ý AI vào báo cáo: ${A.title}${o.mode === "thu-cong" ? " (thủ công)" : ""}.`); save(); render(); toast("Đã lưu vào báo cáo"); break; }
    case "ai-add-tasks": { const A = AI_ACTIONS.find(x => x.id === aiSel), o = aiOut[A.id]; if (!o?.tasks) break;
      const picked = o.tasks.filter(t => t._pick !== false).map(t => { const c = {...t}; delete c._pick; if (o.mode === "thu-cong") c.source = "Trợ lý AI bên ngoài (dán thủ công) – giáo viên đã duyệt"; return c; });
      if (!picked.length){ toast("Chưa chọn nhiệm vụ nào."); break; }
      state.tasks.push(...picked); o.added = true; log(`Thêm ${picked.length} nhiệm vụ do AI đề xuất vào ngân hàng (chưa giao cho nhóm).`); save(); render(); toast(`Đã thêm ${picked.length} nhiệm vụ. Vào Ngân hàng nhiệm vụ để giao cho nhóm.`); break; }
    case "exp-html": offerFile("bao-cao-buoi-hoc.html", reportHTML()); break;
    case "exp-csv": offerFile("tien-do-nhom.csv", reportCSV()); break;
    case "exp-json": offerFile("sao-luu-dieu-phoi-lop-hoc.json", JSON.stringify(state, null, 1)); break;
    case "new-session": confirmBox("Tạo buổi học mới: giữ thông tin lớp và ngân hàng nhiệm vụ, <b>xóa tiến độ, nhận xét, gợi ý AI và nhật ký</b>. Nên sao lưu .json trước.", "Tạo buổi học mới", () => {
        state.progress = {}; state.notes = {}; state.flags = {}; state.aiLog = []; state.log = []; state.isDemo = false; state.run = {round:1, remaining:null, endAt:null, running:false};
        log("Bắt đầu buổi học mới."); save(); aiOut = {}; draft = null; go("setup"); }); break;
    case "load-demo": confirmBox("Thay toàn bộ dữ liệu hiện tại bằng dữ liệu minh họa? Dữ liệu chưa sao lưu sẽ mất.", "Khôi phục minh họa", () => { state = defaultState(); aiOut = {}; draft = null; save(); go("setup"); }); break;
    case "confirm-ok": { const fn = pendingConfirm; pendingConfirm = null; closeModal(); fn && fn(); break; }
    case "close-modal": closeModal(); break;
    case "copy-area": { const ta = document.getElementById("copy-area"); ta.select(); (navigator.clipboard?.writeText(ta.value) || Promise.reject()).then(() => toast("Đã sao chép"), () => toast("Hãy nhấn Ctrl+C để sao chép phần đã bôi đen.")); break; }
  }
});
document.addEventListener("input", e => {

  if (t.id === "music-vol"){ music.vol = +t.value; saveSound(); if (music.master) music.master.gain.setTargetAtTime(music.vol / 100 * 0.6, music.ctx.currentTime, 0.05); return; }

  if (t.dataset.member){ const [gid, mi] = t.dataset.member.split("|"); const g = state.groups.find(x => x.id === gid); g.members[+mi].label = t.value.trim() || g.members[+mi].code; save(); return; }

});
document.addEventListener("change", e => {
  const t = e.target;
  if (t.id === "music-mood"){ music.mood = t.value; saveSound(); if (music.playing){ musicStop(); musicStart(); } return; }
  if (t.dataset.draft){ if (view === "setup") { const keep = t.id; render(); document.getElementById(keep)?.focus(); } return; }
  if (t.dataset.member){ render(); return; }
  if (t.dataset.aif && t.tagName === "SELECT"){ render(); return; }
  if (t.dataset.gen){ const o = aiOut[aiSel]; if (o?.tasks) o.tasks[+t.dataset.gen]._pick = t.checked; return; }
  if (t.dataset.assign){ const [gid, tid] = t.dataset.assign.split("|"); const arr = state.assign[gid] ||= [];
    if (t.checked){ if (!arr.includes(tid)) arr.push(tid); } else state.assign[gid] = arr.filter(x => x !== tid);
    state.assign[gid] = state.tasks.map(x => x.id).filter(id => state.assign[gid].includes(id)); save(); render(); return; }
  if (t.dataset.assignall){ const tid = t.dataset.assignall; state.groups.forEach(g => { const arr = state.assign[g.id] ||= []; if (t.checked){ if (!arr.includes(tid)) arr.push(tid); } else state.assign[g.id] = arr.filter(x => x !== tid); });
    log(`${t.checked ? "Giao" : "Bỏ giao"} “${taskById(tid)?.title}” cho tất cả các nhóm.`); save(); render(); return; }
  if (t.id === "run-round"){ state.run.round = +t.value; state.run.remaining = null; state.run.endAt = state.run.running ? Date.now() + state.lesson.slot * 60000 : null; log(`Chọn Lượt ${t.value}.`); save(); render(); return; }
  if (t.id === "imp-json" && t.files[0]){ const fr = new FileReader(); fr.onload = () => { try { const o = JSON.parse(fr.result); if (o.v !== 1 || !o.lesson || !Array.isArray(o.groups) || !Array.isArray(o.tasks)) throw 0;
      state = o; state.run.running = false; state.run.endAt = null; draft = null; aiOut = {}; save(); render(); toast("Đã nhập dữ liệu"); } catch(err){ toast("Tệp không đúng định dạng sao lưu của ứng dụng."); } }; fr.readAsText(t.files[0]); t.value = ""; }
});
document.addEventListener("keydown", e => { if (e.key === "Escape" && document.getElementById("overlay").innerHTML) closeModal(); });

if (state.run.running) startTimerLoop();
startTimerLoop();
render();
renderMusic();
initAI();
</script>
